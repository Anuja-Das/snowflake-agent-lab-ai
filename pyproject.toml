[project]
name = "snowflake-agent-lab-ai"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "snowflake-connector-python>=3.13.0",
    "snowflake-sqlalchemy>=1.6.1",
    "pandas>=2.2.3",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "loguru>=0.7.2",
]

[dependency-groups]
dev = [
    "poethepoet>=0.29.0",
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "snowflake-cli>=3.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = ["tests"]
