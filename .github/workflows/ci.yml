name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run poe lint
        continue-on-error: true

      - name: Test
        run: uv run poe test
        continue-on-error: true
